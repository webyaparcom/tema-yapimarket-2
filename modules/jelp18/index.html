<section class="modulex-sayac-yildiz-dagilim{{fbsinif}}" {{fbetiket}}>

    {{fbgovde}}

<style>
  /* sayac-yildiz-dagilim — sayac-puan-kirilim tek rozet + çentikli ölçek imleci, sayac-cubuk dolgu çubuğudur; bu modül değerleri 5 yıldız düzeyine bölüp dağılım histogramı + hesaplanmış genel ortalama kurar ve histogramla satır süzer (yorum/değerlendirme paneli iskeleti). */
  .modulex-sayac-yildiz-dagilim { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-yildiz-dagilim *, .modulex-sayac-yildiz-dagilim *::before, .modulex-sayac-yildiz-dagilim *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-yildiz-dagilim :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-yildiz-dagilim :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-yildiz-dagilim :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-yildiz-dagilim :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-yildiz-dagilim img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-yildiz-dagilim) img { height: auto; }
  .modulex-sayac-yildiz-dagilim [hidden] { display: none !important; }
  .modulex-sayac-yildiz-dagilim :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-yildiz-dagilim :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-yildiz-dagilim-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-yildiz-dagilim-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-yildiz-dagilim--bassiz .modulex-sayac-yildiz-dagilim-bas { display: none; }
  .modulex-sayac-yildiz-dagilim-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-yildiz-dagilim-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-yildiz-dagilim-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-yildiz-dagilim-bas { max-width: 760px; }
  .modulex-sayac-yildiz-dagilim-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-yildiz-dagilim-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-yildiz-dagilim-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-yildiz-dagilim-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-yildiz-dagilim-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-yildiz-dagilim-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-yildiz-dagilim-pano { display: grid; grid-template-columns: minmax(250px, 0.8fr) minmax(0, 1.7fr); gap: clamp(24px, 4vw, 60px); align-items: start; }
  .modulex-sayac-yildiz-dagilim-ozet { position: sticky; inset-block-start: 96px; display: grid; gap: 12px; padding: clamp(22px, 3vw, 34px); border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-sayac-yildiz-dagilim-genel { display: flex; align-items: baseline; gap: 8px; }
  .modulex-sayac-yildiz-dagilim-genel-sayi { font-size: clamp(3.6rem, 7vw, 5.2rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 0.95; }
  .modulex-sayac-yildiz-dagilim-genel-tavan { color: --muted--; font-size: 1.3rem; font-weight: 700; }
  .modulex-sayac-yildiz-dagilim-genel-ad { color: --muted--; font-size: 0.95rem; font-weight: 600; }
  .modulex-sayac-yildiz-dagilim-seri { position: relative; display: inline-block; color: color-mix(in srgb, --text-- 18%, transparent); font-size: 1.05rem; letter-spacing: 0.12em; line-height: 1; white-space: nowrap; }
  .modulex-sayac-yildiz-dagilim-seri-dolu { position: absolute; inset-block-start: 0; inset-inline-start: 0; width: var(--d); overflow: hidden; color: --accent--; transition: width 1.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .modulex-sayac-yildiz-dagilim--hazir:not(.modulex-sayac-yildiz-dagilim--gor) .modulex-sayac-yildiz-dagilim-seri-dolu { width: 0; }
  .modulex-sayac-yildiz-dagilim-seri--iri { justify-self: start; font-size: 1.75rem; }
  .modulex-sayac-yildiz-dagilim-histogram { display: grid; gap: 4px; margin-block-start: 8px; padding-block-start: 16px; border-block-start: 1px solid --cizgi--; }
  .modulex-sayac-yildiz-dagilim-filtre { display: grid; grid-template-columns: 3.4ch minmax(0, 1fr) 3ch; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 4px 8px; border: 0; border-radius: 8px; background: transparent; color: --text--; font: inherit; font-weight: 700; font-variant-numeric: tabular-nums; transition: background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-yildiz-dagilim-filtre:disabled { cursor: default; }
  .modulex-sayac-yildiz-dagilim--fjs .modulex-sayac-yildiz-dagilim-filtre:not(:disabled):hover { background: color-mix(in srgb, --accent-- 9%, transparent); }
  .modulex-sayac-yildiz-dagilim-filtre[aria-pressed="true"] { background: --accent--; color: --accentText--; }
  .modulex-sayac-yildiz-dagilim-filtre-i { margin-inline-start: 2px; color: --accentInk--; }
  .modulex-sayac-yildiz-dagilim-filtre-iz { position: relative; height: 8px; overflow: hidden; border-radius: 999px; background: color-mix(in srgb, --text-- 10%, transparent); }
  .modulex-sayac-yildiz-dagilim-filtre-iz::after { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: calc(var(--p) * 100%); border-radius: inherit; background: --accent--; transition: width 1s ease; }
  .modulex-sayac-yildiz-dagilim-filtre-a { color: --muted--; text-align: end; }
  .modulex-sayac-yildiz-dagilim-filtre[aria-pressed="true"] :is(.modulex-sayac-yildiz-dagilim-filtre-i, .modulex-sayac-yildiz-dagilim-filtre-a) { color: inherit; }
  .modulex-sayac-yildiz-dagilim-filtre[aria-pressed="true"] .modulex-sayac-yildiz-dagilim-filtre-iz::after { background: --accentText--; }
  .modulex-sayac-yildiz-dagilim-yorumlar { display: grid; gap: 14px; }
  .modulex-sayac-yildiz-dagilim-yorum { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px 22px; padding: 20px 24px; border: 1px solid --cizgi--; border-radius: --yuvarlak--; background: --bg--; animation: modulex-sayac-yildiz-dagilim-belir 0.4s ease backwards; transition: border-color 0.25s ease, transform 0.25s ease; }
  .modulex-sayac-yildiz-dagilim-yorum:hover { border-color: --accent--; transform: translateX(var(--kay, 4px)); }
  [dir="rtl"] .modulex-sayac-yildiz-dagilim-yorum:hover { --kay: -4px; }
  .modulex-sayac-yildiz-dagilim[data-yildiz-secili] .modulex-sayac-yildiz-dagilim-yorum { border-color: color-mix(in srgb, --accent-- 45%, transparent); }
  .modulex-sayac-yildiz-dagilim-etiket { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
  .modulex-sayac-yildiz-dagilim-ikon { color: --accentInk--; font-size: 20px; }
  .modulex-sayac-yildiz-dagilim-not { margin-block-start: 2px; color: --muted--; font-size: 0.9rem; }
  .modulex-sayac-yildiz-dagilim-sayi { font-size: clamp(1.5rem, 2.6vw, 2rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; text-align: end; white-space: nowrap; }
  .modulex-sayac-yildiz-dagilim-ek { color: --accentInk--; font-size: 0.6em; }
  @keyframes modulex-sayac-yildiz-dagilim-belir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 1024px) {
    .modulex-sayac-yildiz-dagilim-pano { grid-template-columns: minmax(0, 1fr); }
    .modulex-sayac-yildiz-dagilim-ozet { position: static; }
  }
  @media (max-width: 768px) {
    .modulex-sayac-yildiz-dagilim-yorum { grid-template-columns: minmax(0, 1fr) auto; padding: 16px; }
    .modulex-sayac-yildiz-dagilim-yorum > .modulex-sayac-yildiz-dagilim-seri { grid-column: 1 / -1; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-yildiz-dagilim :is(.modulex-sayac-yildiz-dagilim-baslik, .modulex-sayac-yildiz-dagilim-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-yildiz-dagilim-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-yildiz-dagilim { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-yildiz-dagilim *, .modulex-sayac-yildiz-dagilim *::before, .modulex-sayac-yildiz-dagilim *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-yildiz-dagilim";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    const yildiz = (s, P) => {
        const d = [...s.querySelectorAll("[data-yildiz-filtre]")];
        const r = [...s.querySelectorAll("[data-yildiz]")];
        if (!d.length || !r.length) return;
        s.classList.add(P + "--fjs");
        let secili = "";
        const uygula = () => {
          d.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.yildizFiltre === secili)));
          r.forEach((x) => { x.hidden = !!secili && x.dataset.yildiz !== secili; });
          if (secili) s.dataset.yildizSecili = secili; else delete s.dataset.yildizSecili;
        };
        d.forEach((b) => {
          if (Number(b.dataset.adet) > 0) b.disabled = false;
          b.addEventListener("click", () => { secili = secili === b.dataset.yildizFiltre ? "" : b.dataset.yildizFiltre; uygula(); });
        });
        uygula();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
      yildiz(s, P, az);
    });
  })();
</script>
